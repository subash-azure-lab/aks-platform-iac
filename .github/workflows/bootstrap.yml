name: bootstrap

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "envs/**"
      - ".github/workflows/bootstrap.yml"
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "envs/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    working-directory: bootstrap

jobs:
  plan-dev:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -input=false -backend-config=../envs/backend-bootstrap-dev.hcl

      - name: Plan
        run: terraform plan -input=false -no-color -var-file=../envs/dev.tfvars -out=tfplan

      - name: Render plan as text
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('bootstrap/plan.txt', 'utf8');
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n... plan truncated ...';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Bootstrap plan (dev)\n```\n' + plan + '\n```'
            });

  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: bootstrap-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -input=false -backend-config=../envs/backend-bootstrap-dev.hcl

      - name: Plan
        run: terraform plan -input=false -no-color -var-file=../envs/dev.tfvars -out=tfplan

      - name: Apply the saved plan
        run: terraform apply -input=false tfplan

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: bootstrap-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Init
        run: terraform init -input=false -backend-config=../envs/backend-bootstrap-prod.hcl

      - name: Plan
        run: terraform plan -input=false -no-color -var-file=../envs/prod.tfvars -out=tfplan

      - name: Apply the saved plan
        run: terraform apply -input=false tfplan